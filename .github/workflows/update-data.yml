name: Update firmware data.json

on:
  schedule:
    # 每天 UTC 02:30（北京时间 10:30）重新生成固件选择器数据
    - cron: '30 2 * * *'
  workflow_dispatch: # 手动触发

permissions:
  contents: write

concurrency:
  group: firmware-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate data.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN 仅写入临时文件供脚本读取，提交时不会带上
          echo "${GH_TOKEN}" > .github_token
          python3 tools/build_data.py --repo hrk666666/firmware-archives-public --out docs/data.json
          rm -f .github_token

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet docs/data.json; then
            git add docs/data.json
            git commit -m "chore: 每日更新固件数据 $(date -u +%Y-%m-%d)"
            git push
            echo "✅ data.json 已更新并提交"
          else
            echo "✅ data.json 无变化，跳过提交"
          fi

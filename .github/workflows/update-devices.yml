name: Update device map from OronBox

on:
  schedule:
    # 每天 UTC 03:00（北京时间 11:00），在固件同步(02:00)和数据更新(02:30)之后运行
    - cron: '0 3 * * *'
  workflow_dispatch: # 手动触发：Actions 页面点 "Run workflow"

permissions:
  contents: write

concurrency:
  group: firmware-devices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch device map from OronBox
        run: |
          python3 tools/fetch_devices_map.py --out docs/devices-map.json

      - name: Regenerate data.json with merged device map
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GITHUB_TOKEN 仅写入临时文件供脚本读取，提交时不会带上
          echo "${GH_TOKEN}" > .github_token
          python3 tools/build_data.py --repo hrk666666/firmware-archives-public --out docs/data.json
          rm -f .github_token

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet docs/devices-map.json docs/data.json; then
            git add docs/devices-map.json docs/data.json
            git commit -m "chore: 同步 OronBox 设备映射并重建数据 $(date -u +%Y-%m-%d)"
            git push
            echo "✅ 设备映射已更新并提交"
          else
            echo "✅ 设备映射无变化，跳过提交"
          fi
